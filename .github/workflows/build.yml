name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 EXE
        run: python -m PyInstaller --onefile --windowed --name DiskCleaner --clean --noconfirm disk_cleaner.py

      - name: 上传构建产物（main 分支）
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-exe
          path: dist/DiskCleaner.exe

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiskCleaner.exe
          generate_release_notes: true
